# ============================================================
# 网页端注册申请 → 飞书 转投工作流 (V10.17.0)
# ============================================================
# registrations/pending_reg_*.json → 飞书「APP数据备份/注册申请/」
# → 组长安卓端现有60秒轮询自动拉取审批(链路零改动)
# 逻辑见 relay_registrations.py; 密钥走仓库 Secrets。
# ============================================================
name: Relay Web Registrations to Feishu

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay-registrations
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relay pending_reg_*.json to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 relay_registrations.py

      - name: Commit cleanup (deleted relayed files)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A registrations || true
          if [ -n "$(git status --porcelain registrations 2>/dev/null)" ]; then
            # 远端可能已被上次运行删除, 先rebase再推
            git pull --rebase origin main || true
            git commit -m "chore: 清理已转投的注册申请" || true
            git push origin HEAD:main || true
          fi
