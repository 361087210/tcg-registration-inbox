# ============================================================
# 网页端注册申请 → 飞书 转投工作流 (V10.17.0)
# ============================================================
# 背景: 网页版(demo.html)无飞书直连能力(浏览器CORS拦截),网页端注册
#      申请由 09-web-sync.js 直推本仓库 registrations/ 目录。
#      本工作流每5分钟把新申请转投到主库飞书云盘
#      「APP数据备份/注册申请/pending_reg_<手机号>.json」,
#      组长安卓端现有60秒轮询自动拉取审批——审批链路零改动。
# 安全: 申请文件含密码哈希(salt$hash, 不可逆), 与安卓端注册链路同级;
#      token 仅存在于仓库 Secrets, 不落日志。
# 幂等: 飞书同名文件会被覆盖(与安卓端重复注册行为一致);删除仅在
#      飞书上传成功后执行,失败保留下次重试。
# ============================================================
name: Relay Web Registrations to Feishu

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay-registrations
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relay pending_reg_*.json to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          pip install requests --quiet
          python3 - <<'PYEOF'
          import base64, json, os, sys, time
          import urllib.request

          APP_ID = os.environ['FEISHU_APP_ID']
          APP_SECRET = os.environ['FEISHU_APP_SECRET']
          ROOT_TOKEN = os.environ['FEISHU_FOLDER_TOKEN']

          def http_json(url, method='GET', data=None, headers=None, timeout=30):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=headers or {}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return json.loads(e.read().decode())
                  except Exception:
                      return {'code': e.code, 'msg': str(e)}

          def http_delete(url, headers):
              req = urllib.request.Request(url, headers=headers, method='DELETE')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code

          # ---- 飞书认证 ----
          tok = http_json('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',
                          'POST', {'app_id': APP_ID, 'app_secret': APP_SECRET})
          if tok.get('code') != 0:
              print(f'::error::飞书token获取失败: {tok.get("msg")}')
              sys.exit(1)
          H = {'Authorization': 'Bearer ' + tok['tenant_access_token'], 'Content-Type': 'application/json'}

          def list_dir(folder_token):
              out, page_token = [], ''
              while True:
                  url = f'https://open.feishu.cn/open-apis/drive/v1/files?folder_token={folder_token}&page_size=200'
                  if page_token:
                      url += f'&page_token={page_token}'
                  r = http_json(url, headers=H)
                  if r.get('code') != 0:
                      break
                  files = (r.get('data') or {}).get('files') or []
                  out.extend(files)
                  page_token = (r.get('data') or {}).get('next_page_token') or ''
                  if not page_token:
                      break
              return out

          def find_sub(folder_token, name):
              for f in list_dir(folder_token):
                  if f.get('name') == name:
                      return f.get('token')
              return None

          def ensure_sub(folder_token, name):
              token = find_sub(folder_token, name)
              if token:
                  return token
              r = http_json('https://open.feishu.cn/open-apis/drive/v1/files/create_folder',
                            'POST', {'name': name, 'folder_token': folder_token}, H)
              return ((r.get('data') or {}).get('token')) if r.get('code') == 0 else None

          def upload_json(folder_token, file_name, text):
              boundary = 'tcgreg' + str(int(time.time() * 1000))
              payload = (f'--{boundary}\r\nContent-Disposition: form-data; name="file_name"\r\n\r\n{file_name}\r\n'
                         f'--{boundary}\r\nContent-Disposition: form-data; name="parent_type"\r\n\r\nexplorer\r\n'
                         f'--{boundary}\r\nContent-Disposition: form-data; name="parent_node"\r\n\r\n{folder_token}\r\n'
                         f'--{boundary}\r\nContent-Disposition: form-data; name="size"\r\n\r\n{len(text.encode())}\r\n'
                         f'--{boundary}\r\nContent-Disposition: form-data; name="file"; filename="{file_name}"\r\n'
                         f'Content-Type: application/json\r\n\r\n').encode() + text.encode() + f'\r\n--{boundary}--\r\n'.encode()
              headers = dict(H)
              headers['Content-Type'] = f'multipart/form-data; boundary={boundary}'
              return http_json('https://open.feishu.cn/open-apis/drive/v1/files/upload_all', 'POST', None, headers) if False else \
                  http_raw_upload(payload, headers)

          def http_raw_upload(body, headers):
              req = urllib.request.Request('https://open.feishu.cn/open-apis/drive/v1/files/upload_all',
                                           data=body, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return json.loads(e.read().decode())
                  except Exception:
                      return {'code': e.code, 'msg': str(e)}

          # ---- 定位 注册申请 目录(不存在则创建) ----
          data_folder = find_sub(ROOT_TOKEN, 'APP数据备份') or ensure_sub(ROOT_TOKEN, 'APP数据备份')
          if not data_folder:
              print('::error::APP数据备份目录不可用')
              sys.exit(1)
          pending_folder = ensure_sub(data_folder, '注册申请')
          if not pending_folder:
              print('::error::注册申请目录不可用')
              sys.exit(1)

          # ---- 扫描本仓库 registrations/ 目录 ----
          regs_dir = 'registrations'
          if not os.path.isdir(regs_dir):
              print('registrations/ 目录不存在,无待转投申请')
              sys.exit(0)
          names = sorted(n for n in os.listdir(regs_dir) if n.startswith('pending_reg_') and n.endswith('.json'))
          if not names:
              print('无待转投申请')
              sys.exit(0)
          print(f'待转投申请 {len(names)} 个: {names}')

          gh_token = os.environ.get('GH_TOKEN', '')
          gh_headers = {'Authorization': f'Bearer {gh_token}', 'Accept': 'application/vnd.github+json'}
          repo = os.environ.get('GITHUB_REPOSITORY', '361087210/tcg-registration-inbox')
          ok_count, fail_count = 0, 0
          for name in names:
              path = os.path.join(regs_dir, name)
              with open(path, 'rb') as f:
                  text = f.read().decode('utf-8')
              try:
                  json.loads(text)  # 合法性预检
              except Exception as e:
                  print(f'::warning::{name} JSON非法,跳过: {e}')
                  fail_count += 1
                  continue
              up = upload_json(pending_folder, name, text)
              if up.get('code') == 0:
                  print(f'✅ 已转投 {name}')
                  # 删除本仓库中的文件
                  del_url = f'https://api.github.com/repos/{repo}/contents/{path}'
                  r = http_json(del_url, headers=gh_headers)
                  if isinstance(r, dict) and r.get('sha'):
                      status = http_delete(del_url, {**gh_headers, 'Content-Type': 'application/json'})
                      # DELETE需要body(sha), 用带body的请求重发
                      if status not in (200, 204):
                          body = json.dumps({'message': f'relay: 已转投 {name}', 'sha': r['sha']}).encode()
                          req = urllib.request.Request(del_url, data=body, method='DELETE',
                                                       headers={**gh_headers, 'Content-Type': 'application/json'})
                          try:
                              with urllib.request.urlopen(req, timeout=30) as resp:
                                  status = resp.status
                          except urllib.error.HTTPError as e2:
                              status = e2.code
                      print(f'   删除源文件: HTTP {status}')
                  ok_count += 1
              else:
                  print(f'::warning::{name} 飞书上传失败: code={up.get("code")} msg={up.get("msg")}')
                  fail_count += 1
          print(f'转投完成: 成功{ok_count} 失败{fail_count}')
          if fail_count:
              sys.exit(1)  # 非零退出让运行显示失败提醒,但已成功的文件已删除不会重复转投
          PYEOF

      - name: Commit cleanup (deleted relayed files)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A registrations || true
          git diff --cached --quiet || (git commit -m "chore: 清理已转投的注册申请" && git push origin HEAD:main) || true
